name: Build & Publish Release

on:
  workflow_dispatch:

jobs:
  BuildAndPublish:
    runs-on: windows-latest
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job

    steps:
    - uses: actions/checkout@v2
      with:
        submodules: recursive
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: '8.0.x'
    - name: Build PlMpegNet
      run: dotnet build PlMpegNet.Simple.sln --configuration Release
    - name: Test
      run: dotnet test PlMpegNet.Simple.sln
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{secrets.NUGET_USER}}
    - name: Publish PlMpegNet to NuGet
      run: nuget.exe push Source\bin\Release\PlMpegNet.*.nupkg ${{steps.login.outputs.NUGET_API_KEY}} -Source https://api.nuget.org/v3/index.json